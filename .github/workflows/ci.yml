name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          cd backend
          uv sync
      - name: Lint
        run: |
          cd backend
          uv run ruff check app tests
      - name: Test
        run: |
          cd backend
          uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install deps
        run: |
          cd frontend
          corepack enable pnpm
          pnpm install
      - name: Lint
        run: |
          cd frontend
          pnpm lint
      - name: Tests
        run: |
          cd frontend
          pnpm test -- --run
