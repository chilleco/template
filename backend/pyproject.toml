[project]
name = "ai-ready-backend"
version = "0.1.0"
description = "FastAPI backend template optimized for AI-assisted development"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13.1",
  "asyncpg>=0.29.0",
  "redis>=5.0.4",
  "arq>=0.23",
  "loguru>=0.7.2",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "pydantic>=2.7.1",
  "pydantic-settings>=2.2.1",
  "httpx[http2]>=0.27.0",
  "sentry-sdk[fastapi]>=1.45.0",
  "pyotp>=2.9.0",
  "phonenumberslite>=8.13.38",
  "email-validator>=2.1.1",
  "orjson>=3.10.0",
  "itsdangerous>=2.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.1",
  "pytest-asyncio>=0.23.6",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "faker>=24.4.0",
  "datamodel-code-generator>=0.25.4",
  "ruff>=0.4.2",
  "mypy>=1.9.0",
  "types-redis>=4.6.0.20240425",
  "types-passlib>=1.7.7.20240327",
  "pre-commit>=3.7.0"
]

dynamic = ["classifiers"]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.uv.sources]
ai-ready-backend = {
  workspace = true
}

[tool.uv.workspace]
members = ["app"]

[tool.uv.defaults]
index-url = "https://pypi.org/simple"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
fix = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --disable-warnings"
asyncio_mode = "auto"
testpaths = [
  "tests"
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build]
packages = ["app"]
