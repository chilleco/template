[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-template-backend"
version = "0.1.0"
description = "Modular FastAPI backend template with async task infrastructure, auth, and integrations"
readme = "../docs/BACKEND_OVERVIEW.md"
requires-python = ">=3.12"
authors = [
  { name = "Your Team" }
]
license = { text = "MIT" }
dependencies = [
  "fastapi[standard]>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.2.1",
  "sqlalchemy[asyncio]>=2.0.29",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "redis>=5.0.4",
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3.0",
  "loguru>=0.7.2",
  "sentry-sdk[fastapi]>=1.42.0",
  "httpx[http2]>=0.27.0",
  "typer[all]>=0.12.3",
  "arq>=0.25.0",
  "email-validator>=2.1.1",
  "itsdangerous>=2.2.0",
  "pydantic[email]>=2.7.1",
  "python-multipart>=0.0.9",
  "orjson>=3.10.3",
  "ruff>=0.4.4",
  "pytest>=8.2.1",
  "pytest-asyncio>=0.23.6",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.12.0",
  "faker>=24.9.0",
  "fakeredis>=2.23.1",
  "psycopg[binary]>=3.1.18",
  "structlog>=24.1.0"
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7.1"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]
exclude = ["app/migrations"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-s --strict-markers --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = [
  "tests",
]
